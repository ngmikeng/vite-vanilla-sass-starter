<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite Vanilla Template</title>
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Dashboard</h2>
        <nav>
          <a href="#">Home</a>
          <a href="#">Reports</a>
          <a href="#">Settings</a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main">
        <!-- Topbar -->
        <div class="topbar">
          <h1>Overview</h1>
          <input type="text" placeholder="Search..." />
        </div>

        <!-- Cards -->
        <div class="card">
          <h3>Total Users</h3>
          <p>1,200</p>
        </div>

        <div class="card">
          <h3>Revenue</h3>
          <p>$34,000</p>
        </div>

        <!-- Button Example -->
        <button class="button">Generate Report</button>
      </main>
    </div>
  </body>
</html>
